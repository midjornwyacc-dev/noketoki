name: Noketoki
options:
  bundleIdPrefix: app.noketoki
  deploymentTarget:
    iOS: "16.0"
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Noketoki
      PRODUCT_BUNDLE_IDENTIFIER: app.noketoki.app
      # Replace with your 10-character Team ID before device builds.
      DEVELOPMENT_TEAM: YOUR_APPLE_TEAM_ID
targets:
  Noketoki_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Noketoki_iOS
      - path: LaunchScreen.storyboard
    info:
      path: Noketoki_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        NSMicrophoneUsageDescription: Noketoki записывает звук с микрофона только пока вы удерживаете кнопку диктовки.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    entitlements:
      path: Noketoki_iOS/Noketoki_iOS.entitlements
    settings:
      base:
        ENABLE_BITCODE: false
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
    dependencies:
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
    preBuildScripts:
      - script: |
          npx tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
