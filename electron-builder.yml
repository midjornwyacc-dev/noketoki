appId: app.noketoki.desktop
productName: Noketoki
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - '**/{koffi}/**'
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Noketoki записывает звук с микрофона только пока вы удерживаете клавишу диктовки.
    NSAppleEventsUsageDescription: Noketoki вставляет распознанный текст в активное приложение через Cmd+V.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: true
